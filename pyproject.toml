[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-detection"
version = "1.1.0"
description = "Detecting population drift in deployed healthcare AI systems"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Malik Adeel Anjum", email = "malikanjum.adeel@gmail.com" }]
keywords = ["drift-detection", "anomaly-detection", "healthcare-ai", "covariate-shift"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scikit-learn>=1.2",
    "scipy>=1.9",
    "joblib>=1.2",
]

[project.optional-dependencies]
shap = ["shap>=0.44"]
viz = ["matplotlib>=3.6", "seaborn>=0.12"]
notebooks = ["jupyter>=1.0", "ipython>=8.0", "tqdm>=4.64"]
dev = ["pytest>=7.0", "shap>=0.44", "matplotlib>=3.6", "seaborn>=0.12"]

[project.urls]
Homepage = "https://github.com/MalikAdeel-Hull/Population-Drift"
Preprint = "https://doi.org/10.5281/zenodo.20633719"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: tests that take minutes (SHAP KernelExplainer)",
]
